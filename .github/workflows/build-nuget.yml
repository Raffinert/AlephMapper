name: Build NuGet package

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AlephMapper.slnx

      - name: Build solution
        run: dotnet build AlephMapper.slnx --configuration Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Run tests
        run: dotnet test AlephMapper.slnx --configuration Release --no-build --no-restore

      - name: Pack NuGet package
        run: dotnet pack source/AlephMapper.csproj --configuration Release --no-build --no-restore --output artifacts/nuget

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: AlephMapper-nuget
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
